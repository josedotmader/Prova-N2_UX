<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Usuários</title>
    <link rel="stylesheet" href="usuarios.css">
</head>

<body>

    <div class="header">
        <nav>
            <button onclick="location.href='index.html'">Posts</button>
            <button onclick="location.href='usuarios.html'">Usuários</button>
        </nav>
    </div>

    <h1>Gerenciamento de Usuários</h1>
    <p class="instrucao">Preencha os dados abaixo para adicionar um novo usuário.</p>

    <div class="formulario">
        <input type="text" id="nomeUser" placeholder="Nome Completo">
        <input type="email" id="emailUser" placeholder="E-mail">
        <input type="text" id="telefoneUser" placeholder="Telefone">
        <input type="text" id="cidadeUser" placeholder="Cidade">
        <button onclick="adicionarUsuario()">Adicionar Usuário</button>
    </div>

    <p id="status-usuarios" class="status-msg">Carregando dados da internet...</p>
    <div id="usuarios"></div>

    <script src="script.js"></script>

</body>

</html>
