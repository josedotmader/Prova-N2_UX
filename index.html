<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Posts</title>
    <link rel="stylesheet" href="posts.css">
</head>

<body>

    <div class="header">
        <nav>
            <button onclick="location.href='index.html'">Posts</button>
            <button onclick="location.href='usuarios.html'">Usuários</button>
        </nav>
    </div>

    <h1>Gerenciamento de Posts</h1>
    <p class="instrucao">Preencha os campos abaixo para adicionar um novo post.</p>

    <div class="formulario">
        <input type="text" id="titulo" placeholder="Digite o título do post">
        <textarea id="descricao" placeholder="Digite a descrição do post"></textarea>
        <button onclick="adicionarPost()">Adicionar Post</button>
    </div>

    <p id="status-posts" class="status-msg">Carregando dados da internet...</p>
    <div id="elemento"></div>

    <script src="script.js"></script>

</body>

</html>
